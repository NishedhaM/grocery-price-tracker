name: Daily grocery price scrape

on:
  schedule:
    # 16:30 UTC = 22:00 (10 PM) Asia/Colombo — adjust to taste.
    - cron: "30 16 * * *"
  workflow_dispatch: {}   # lets you trigger a run manually from the Actions tab

permissions:
  contents: write   # needed to commit the updated database back to the repo

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily scrape
        run: python -m src.run_daily

      - name: Commit updated database
        # always() so a store failing for real (a changed page, a
        # rotated campaign ID, a blocked bot check) never causes the
        # whole day's successfully-scraped data to be silently
        # discarded — run_daily.py already tolerates a single store
        # failing (that's what its non-zero exit code is reporting),
        # so this step should still save whatever *did* come in.
        if: always()
        run: |
          git config user.name "grocery-price-bot"
          git config user.email "actions@users.noreply.github.com"
          git add db/grocery_prices.db
          git diff --cached --quiet || git commit -m "Daily scrape: $(date -u +%Y-%m-%d)"
          git push
